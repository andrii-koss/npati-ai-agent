# OSS/self-hosted: one runtime, no per-project Docker containers or Docker socket.
# Use docker-compose.sandbox-isolated.yml instead for isolated Docker sandboxes.
services:
  agent-api:
    environment:
      NPATI_PROJECT_RUNTIME_MODE: shared
      # Optional dev Project API binding over the existing signed runner channel.
      NPATI_PROJECT_API_SANDBOX_URL: ${NPATI_PROJECT_API_SANDBOX_URL:-}
      NPATI_PROJECT_API_SERVICE_BINDING: ${NPATI_PROJECT_API_SERVICE_BINDING:-}
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_URL: http://sandbox-runner:7865
      NPATI_PREVIEW_SECRET: ${NPATI_PREVIEW_SECRET:?required}
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-http://localhost:${NPATI_AGENT_API_PORT:-3001}}
  company-worker:
    environment:
      NPATI_PROJECT_RUNTIME_MODE: shared
      # Optional dev Project API binding over the existing signed runner channel.
      NPATI_PROJECT_API_SANDBOX_URL: ${NPATI_PROJECT_API_SANDBOX_URL:-}
      NPATI_PROJECT_API_SERVICE_BINDING: ${NPATI_PROJECT_API_SERVICE_BINDING:-}
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_URL: http://sandbox-runner:7865
      NPATI_PREVIEW_SECRET: ${NPATI_PREVIEW_SECRET:?required}
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-http://localhost:${NPATI_AGENT_API_PORT:-3001}}
  sandbox-runner:
    container_name: npati-project-runtime
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: project-runtime
    restart: unless-stopped
    environment:
      NPATI_PROJECT_RUNTIME_MODE: shared
      # Optional dev Project API binding over the existing signed runner channel.
      NPATI_PROJECT_API_SANDBOX_URL: ${NPATI_PROJECT_API_SANDBOX_URL:-}
      NPATI_PROJECT_API_SERVICE_BINDING: ${NPATI_PROJECT_API_SERVICE_BINDING:-}
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_SECRET: ${NPATI_SANDBOX_RUNNER_SECRET:?required}
      ALLOWED_HOSTS: ${NPATI_SANDBOX_ALLOWED_HOSTS:-registry.npmjs.org,registry.yarnpkg.com,pypi.org,files.pythonhosted.org,github.com,codeload.github.com,api.github.com,objects.githubusercontent.com,pub.dev,www.gstatic.com,fonts.gstatic.com,fonts.googleapis.com}
    ports:
      - "127.0.0.1:7865:7865"
    volumes:
      - project-runtime-workspaces:/projects
      - project-runtime-state:/runtime-state
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL, NET_ADMIN]
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/sandbox/project-runtime-seccomp.json
      - apparmor=unconfined
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    mem_limit: ${NPATI_PROJECT_RUNTIME_MEMORY:-4g}
    cpus: ${NPATI_PROJECT_RUNTIME_CPU:-4}
    pids_limit: 4096
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:7865/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [npati-agent-network]

volumes:
  project-runtime-workspaces:
    name: npati-project-runtime-workspaces
  project-runtime-state:
    name: npati-project-runtime-state
