services:
  scale-api-a:
    image: npati-agent-agent-api:latest
    command: ["node", "dist/server.js"]
    environment: &scale-api-environment
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1024
      NPATI_AGENT_API_PORT: 3001
      NPATI_AUTH_STRICT: "true"
      NPATI_JWT_SECRET: ${NPATI_JWT_SECRET:-pati-backend-jwt-secret-key-2024-min-32-chars-long}
      NPATI_WEB_ORIGIN: http://localhost:3000
      OMNIROUTE_BASE_URL: http://omniroute:20128
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-npati-agent-internal-local}
      DATABASE_URL: postgresql://${NPATI_POSTGRES_USER:-npati}:${NPATI_POSTGRES_PASSWORD:-npati}@postgres:5432/${NPATI_POSTGRES_DB:-npati_agent}
      REDIS_URL: redis://redis:6379
      NPATI_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3101:3001"
    volumes:
      - ./apps/agent-api/dist:/app/dist:ro
      - npati-agent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &scale-api-healthcheck
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [npati-agent-network]

  scale-api-b:
    image: npati-agent-agent-api:latest
    command: ["node", "dist/server.js"]
    environment: *scale-api-environment
    ports:
      - "127.0.0.1:3102:3001"
    volumes:
      - ./apps/agent-api/dist:/app/dist:ro
      - npati-agent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *scale-api-healthcheck
    networks: [npati-agent-network]

  scale-certifier:
    image: node:24-alpine
    working_dir: /workspace
    command: ["node", "scripts/run-scale-certification.mjs"]
    environment:
      NPATI_SCALE_ENDPOINTS: http://scale-api-a:3001,http://scale-api-b:3001
      NPATI_JWT_SECRET: ${NPATI_JWT_SECRET:-pati-backend-jwt-secret-key-2024-min-32-chars-long}
    volumes:
      - ./:/workspace
    depends_on:
      scale-api-a:
        condition: service_healthy
      scale-api-b:
        condition: service_healthy
    networks: [npati-agent-network]
