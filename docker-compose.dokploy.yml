services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [npati-agent]

  agent-api:
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
      args:
        NPATI_BUILD_COMMIT: ${NPATI_BUILD_COMMIT:-unknown}
        NPATI_BUILD_TIME: ${NPATI_BUILD_TIME:-unknown}
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    environment: &agent-api-env
      NODE_ENV: production
      NPATI_ENV: production
      NPATI_AGENT_API_PORT: 3001
      NPATI_PROJECT_RUNTIME_MODE: shared
      NPATI_SANDBOX_RUNNER_MODE: ${NPATI_SANDBOX_RUNNER_MODE:-local}
      NPATI_SANDBOX_RUNNER_URL: ${NPATI_SANDBOX_RUNNER_URL:-http://sandbox-runner:7865}
      NPATI_SANDBOX_RUNNER_SECRET: ${NPATI_SANDBOX_RUNNER_SECRET:-}
      NPATI_PREVIEW_SECRET: ${NPATI_PREVIEW_SECRET:-}
      # Public HTTPS base URL of the Project API (Data Studio). Without it generated sites and
      # apps get no PROJECT_API_URL/PROJECT_PUBLISHABLE_KEY and the SDK is not vendored.
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-}
      NPATI_AUTH_STRICT: "true"
      NPATI_ALLOW_LEGACY_PASSWORD_AUTH: "false"
      NPATI_BACKEND_URL: ${NPATI_BACKEND_URL:?NPATI_BACKEND_URL is required}
      NPATI_WEB_ORIGIN: ${NPATI_WEB_ORIGIN:?NPATI_WEB_ORIGIN is required}
      NPATI_AGENT_PUBLIC_DOMAIN: ${NPATI_AGENT_PUBLIC_DOMAIN:?NPATI_AGENT_PUBLIC_DOMAIN is required}
      NPATI_AGENT_VERSION: ${NPATI_AGENT_VERSION:-0.1.0}
      NPATI_TERMINAL_POLICY_LOG: ${NPATI_TERMINAL_POLICY_LOG:-true}
      NPATI_DEPLOYMENT_TYPE: ${NPATI_DEPLOYMENT_TYPE:-self_hosted}
      NPATI_HOSTED_REGISTRATION_TOKEN: ${NPATI_HOSTED_REGISTRATION_TOKEN:-}
      NPATI_ENCRYPTION_KEY: ${NPATI_ENCRYPTION_KEY:?NPATI_ENCRYPTION_KEY is required}
      NPATI_REMOTE_ACCESS_TOKEN_SECRET: ${NPATI_REMOTE_ACCESS_TOKEN_SECRET:?NPATI_REMOTE_ACCESS_TOKEN_SECRET is required}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.npati.ai}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-npati-dashboard}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      NPATI_COMPANY_RUN_TIMEOUT_MS: ${NPATI_COMPANY_RUN_TIMEOUT_MS:-120000}
      NPATI_ADMISSION_MAX_CONCURRENT: ${NPATI_ADMISSION_MAX_CONCURRENT:-20}
      NPATI_ADMISSION_MAX_CONCURRENT_PER_TENANT: ${NPATI_ADMISSION_MAX_CONCURRENT_PER_TENANT:-10}
      NPATI_ADMISSION_MAX_QUEUE_LENGTH: ${NPATI_ADMISSION_MAX_QUEUE_LENGTH:-200}
      NPATI_ADMISSION_FREE_SHED_THRESHOLD: ${NPATI_ADMISSION_FREE_SHED_THRESHOLD:-0.75}
      NPATI_COMPANY_WORKER_CONCURRENCY: ${NPATI_COMPANY_WORKER_CONCURRENCY:-2}
      NPATI_COMPANY_RUN_LEASE_MS: ${NPATI_COMPANY_RUN_LEASE_MS:-180000}
      NPATI_COMPANY_RECOVERY_INTERVAL_MS: ${NPATI_COMPANY_RECOVERY_INTERVAL_MS:-30000}
      OMNIROUTE_BASE_URL: http://omniroute:20128
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?OMNIROUTE_API_KEY is required}
      OMNIROUTE_MANAGEMENT_PASSWORD: ${OMNIROUTE_MANAGEMENT_PASSWORD:?OMNIROUTE_MANAGEMENT_PASSWORD is required}
      OMNIROUTE_TRANSCRIPTION_MODEL: ${OMNIROUTE_TRANSCRIPTION_MODEL:-openai/whisper-1}
      OMNIROUTE_TTS_MODEL: ${OMNIROUTE_TTS_MODEL:-openai/gpt-4o-mini-tts}
      OMNIROUTE_EMBEDDING_MODEL: ${OMNIROUTE_EMBEDDING_MODEL:-}
      OMNIROUTE_RERANK_MODEL: ${OMNIROUTE_RERANK_MODEL:-}
      OMNIROUTE_VISION_MODEL: ${OMNIROUTE_VISION_MODEL:-openai/gpt-5.6-luna}
      NPATI_DATA_DIR: /app/data
      NPATI_HUB_BASE_URL: ${NPATI_HUB_BASE_URL:-}
      NPATI_HUB_API_KEY: ${NPATI_HUB_API_KEY:-}
      CRAWL4AI_BASE_URL: http://crawler:11235
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN is required}
      BROWSER_USE_WORKER_URL: http://browser-use-worker:8765
      NPATI_BROWSER_INTERNAL_TOKEN: ${NPATI_BROWSER_INTERNAL_TOKEN:?NPATI_BROWSER_INTERNAL_TOKEN is required}
      NPATI_BROWSER_UPLOAD_ROOT: /app/data/browser-uploads
      DATABASE_URL: postgresql://${NPATI_POSTGRES_USER:-npati}:${NPATI_POSTGRES_PASSWORD:?NPATI_POSTGRES_PASSWORD is required}@postgres:5432/${NPATI_POSTGRES_DB:-npati_agent}
      NPATI_PROJECTS_POSTGRES_HOST: postgres-projects
      NPATI_PROJECTS_POSTGRES_PORT: 5432
      NPATI_PROJECTS_POSTGRES_ADMIN_USER: ${NPATI_PROJECTS_POSTGRES_ADMIN_USER:-npati_projects_admin}
      NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD: ${NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD:?NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD is required (Data Studio project databases)}
      NPATI_PROJECTS_POSTGRES_ADMIN_DB: postgres
      NPATI_PROJECTS_SNAPSHOT_DIR: /app/project-snapshots
      NPATI_PROJECTS_SNAPSHOT_RETENTION_DAYS: ${NPATI_PROJECTS_SNAPSHOT_RETENTION_DAYS:-30}
      NPATI_DATA_MAX_COLLECTIONS: ${NPATI_DATA_MAX_COLLECTIONS:-50}
      NPATI_DATA_MAX_FIELDS: ${NPATI_DATA_MAX_FIELDS:-100}
      NPATI_DATA_MAX_ROWS: ${NPATI_DATA_MAX_ROWS:-100}
      NPATI_DATA_MAX_QUERIES_PER_MINUTE: ${NPATI_DATA_MAX_QUERIES_PER_MINUTE:-600}
      NPATI_DATA_MAX_DATABASE_BYTES: ${NPATI_DATA_MAX_DATABASE_BYTES:-1000000000}
      NPATI_DATA_MAX_CONNECTIONS: ${NPATI_DATA_MAX_CONNECTIONS:-10}
      NPATI_DATA_BACKUP_INTERVAL_MINUTES: ${NPATI_DATA_BACKUP_INTERVAL_MINUTES:-1440}
      NPATI_DATA_BACKUP_KEEP: ${NPATI_DATA_BACKUP_KEEP:-7}
      NPATI_DATA_BACKUP_TICK_SECONDS: ${NPATI_DATA_BACKUP_TICK_SECONDS:-300}
      NPATI_DATA_BACKUP_DISABLED: ${NPATI_DATA_BACKUP_DISABLED:-}
      NPATI_PROMOTE_DATA_MAX_ROWS: ${NPATI_PROMOTE_DATA_MAX_ROWS:-500}
      QDRANT_URL: http://qdrant:6333
      QDRANT_INT8_ENABLED: "true"
      FTS5_DB_PATH: /app/data/company-memory-fts5.sqlite
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-npati-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_OPERATION_TIMEOUT_MS: ${MINIO_OPERATION_TIMEOUT_MS:-15000}
      MINIO_STREAM_IDLE_TIMEOUT_MS: ${MINIO_STREAM_IDLE_TIMEOUT_MS:-30000}
      MINIO_STREAM_TOTAL_TIMEOUT_MS: ${MINIO_STREAM_TOTAL_TIMEOUT_MS:-300000}
      NPATI_STORAGE_RECONCILE_INTERVAL_MS: ${NPATI_STORAGE_RECONCILE_INTERVAL_MS:-21600000}
      NPATI_STORAGE_ORPHAN_GRACE_MS: ${NPATI_STORAGE_ORPHAN_GRACE_MS:-86400000}
      NPATI_STORAGE_RECONCILE_LEASE_MS: ${NPATI_STORAGE_RECONCILE_LEASE_MS:-1800000}
      NPATI_STORAGE_RECONCILE_PAGE_SIZE: ${NPATI_STORAGE_RECONCILE_PAGE_SIZE:-250}
    expose:
      - "3001"
    volumes:
      - agent-data:/app/data
      - postgres-projects-snapshots:/app/project-snapshots
    depends_on:
      omniroute:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-projects:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      crawler:
        condition: service_healthy
      browser-use-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 300s
    networks: [npati-agent, npati-sandbox-control, npati-projects-db]

  company-worker:
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
      args:
        NPATI_BUILD_COMMIT: ${NPATI_BUILD_COMMIT:-unknown}
        NPATI_BUILD_TIME: ${NPATI_BUILD_TIME:-unknown}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *agent-api-env
      NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD: ""
    volumes:
      - agent-data:/app/data
    depends_on:
      agent-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-use-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "import('redis').then(async({createClient})=>{const c=createClient({url:process.env.REDIS_URL});await c.connect();const v=await c.get('npati:company-worker:heartbeat');await c.quit();if(!v)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks: [npati-agent, npati-sandbox-control]

  sandbox-runner:
    container_name: npati-project-runtime
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: project-runtime
    restart: unless-stopped
    environment:
      NPATI_PROJECT_RUNTIME_MODE: shared
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_SECRET: ${NPATI_SANDBOX_RUNNER_SECRET:-}
      ALLOWED_HOSTS: ${NPATI_SANDBOX_ALLOWED_HOSTS:-registry.npmjs.org,registry.yarnpkg.com,pypi.org,files.pythonhosted.org,github.com,codeload.github.com,api.github.com,objects.githubusercontent.com}
    volumes:
      - project-runtime-workspaces:/projects
      - project-runtime-state:/runtime-state
    expose:
      - "7865"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL, NET_ADMIN]
    security_opt: [no-new-privileges:true]
    cpus: ${NPATI_PROJECT_RUNTIME_CPU:-4}
    mem_limit: ${NPATI_PROJECT_RUNTIME_MEMORY:-4g}
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7865/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [npati-agent, npati-sandbox-control]

  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
      args:
        CRAWL4AI_VERSION: ${CRAWL4AI_VERSION:-0.9.2}
    image: npati-agent-crawler:${CRAWL4AI_VERSION:-0.9.2}
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?CRAWL4AI_API_TOKEN is required}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:?CRAWL4AI_SECRET_KEY is required}
      REDIS_PASSWORD: ${CRAWL4AI_SECRET_KEY:?CRAWL4AI_SECRET_KEY is required}
      NPATI_CRAWLER_STATE_DIR: /app/npati-state
      NPATI_CRAWLER_PAGE_TIMEOUT_MS: ${NPATI_CRAWLER_PAGE_TIMEOUT_MS:-45000}
    volumes:
      - crawler-state:/app/npati-state
    expose:
      - "11235"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 45s
    networks: [npati-agent]

  browser-use-worker:
    build:
      context: .
      dockerfile: services/browser-use-worker/Dockerfile
    restart: unless-stopped
    shm_size: 2gb
    environment:
      NPATI_ENV: production
      NPATI_BROWSER_INTERNAL_TOKEN: ${NPATI_BROWSER_INTERNAL_TOKEN:?NPATI_BROWSER_INTERNAL_TOKEN is required}
      NPATI_BROWSER_STATE_DIR: /state
      NPATI_BROWSER_MAX_RETRIES: ${NPATI_BROWSER_MAX_RETRIES:-2}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY:-}
      BROWSER_USE_MODEL: ${BROWSER_USE_MODEL:-bu-2-0}
    volumes:
      - browser-use-state:/state
      - agent-data:/app/data:ro
    expose:
      - 8765
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks: [npati-agent]

  omniroute:
    image: docker.io/diegosouzapw/omniroute:3.8.50
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: 20128
      DASHBOARD_PORT: 20128
      API_PORT: 20129
      API_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:?OMNIROUTE_API_KEY is required}
      OMNIROUTE_API_KEY_ID: env-key
      INITIAL_PASSWORD: ${OMNIROUTE_MANAGEMENT_PASSWORD:?OMNIROUTE_MANAGEMENT_PASSWORD is required}
      ARENA_ELO_SYNC_ENABLED: ${ARENA_ELO_SYNC_ENABLED:-false}
      JINA_AI_API_KEY: ${JINA_AI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    expose:
      - "20128"
      - "20129"
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks: [npati-agent]

  qdrant:
    image: docker.io/qdrant/qdrant:v1.15.4
    pull_policy: always
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [npati-agent]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-npati-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [npati-agent]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [npati-agent]

  postgres-projects:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NPATI_PROJECTS_POSTGRES_ADMIN_USER:-npati_projects_admin}
      POSTGRES_PASSWORD: ${NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD:?NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD is required (Data Studio project databases)}
      POSTGRES_DB: postgres
    volumes:
      - postgres-projects-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 8
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    networks: [npati-projects-db]
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NPATI_POSTGRES_USER:-npati}
      POSTGRES_PASSWORD: ${NPATI_POSTGRES_PASSWORD:?NPATI_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${NPATI_POSTGRES_DB:-npati_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [npati-agent]

networks:
  npati-projects-db:
    internal: true
  npati-agent:
  npati-sandbox-control:
    internal: true

volumes:
  project-runtime-workspaces:
  project-runtime-state:
  agent-data:
  omniroute-data:
  redis-data:
  postgres-data:
  postgres-projects-data:
  postgres-projects-snapshots:
  crawler-state:
  minio-data:
  qdrant-data:
  browser-use-state:
