name: CI

# G1 — AUTOMATIC CI IS DISABLED ON PURPOSE (owner decision). This workflow has **no automatic trigger**: it runs
# only through `workflow_dispatch` (Actions -> CI -> Run workflow). Nothing runs on a push, a pull request or a
# schedule any more.
#
# WHY. The repository is private and its plan carries no Actions minutes for it. On the last automatic run
# **every** job failed in about **2 seconds** — `Security gate (SG-1)`, `Node 22 / ubuntu-24.04`,
# `Node 22 / windows-latest`, `Node 22 / macos-15-intel`, `Coding-agent eval smoke` and `Docker / Ubuntu` alike —
# and `Release gate` was reported `Skipped` because it `needs` the others. A job that dies in two seconds never
# started: `macos-*` and `windows-*` runners are simply not offered to a private repository without a paid plan,
# and the Linux jobs went the same way for want of minutes. Those checks were therefore never evidence — they
# were only a permanent red signal, and a permanently red signal is one nobody reads.
#
# WHAT WAS NOT DONE. No workflow file was deleted and **no job and no step was removed**: everything below is
# intact and every command stays runnable by hand. The trigger contract that was removed — including the
# behaviour-path filter that used to gate `push` and `pull_request` — is kept verbatim in the RE-ENABLE RECIPE
# after the `on:` block, so turning CI back on is **one commit**: restore the triggers from the recipe and update
# the pins in `tests/coding-agent-c14-ci-and-lint-gates.test.ts`.
#
# THIS IS AN ACCEPTED RISK, NOT A FIX. With no automatic trigger the mandatory security gate blocks no merge and
# no release, `npm run test:known-failures` never runs on a push, and the only thing that executes the gate is the
# owner's local escalated run — a compensating control that is **manual** and depends on discipline. It is
# recorded with an owner and an expiry in `security-gate/security-gate-report.md` §6, and its effect on the G1
# requirement "a separate mandatory CI job (not skipped, blocks merge/release)" is stated in
# `security-gate/current-state.md` rather than left silent.
#
# Two invariants this file must keep (pinned by `tests/coding-agent-c14-ci-and-lint-gates.test.ts`):
#   1. no step uses `continue-on-error`, so a failure in any step fails its job;
#   2. the security-gate job keeps **no** path filter and no `if:` — its own fixed suite list is the contract,
#      and it is the job whose failure the project treats as non-negotiable.
on:
  workflow_dispatch:

# -------------------------------------------------------------------------------------------------------------------------------
# RE-ENABLE RECIPE — the exact trigger contract that was removed, kept so re-enabling is one commit and not a
# restoration from git history. To restore automated CI:
#   1. put the three triggers of the `(triggers)` block below back into the `on:` block above;
#   2. use the `(paths)` list verbatim for **both** `push:` and `pull_request:` — the two lists were pinned
#      identical, which is why the list is written once here instead of twice, and the file stays plain YAML that
#      any parser (and the reviewer) reads without anchor semantics;
#   3. `schedule` deliberately **ignores** the path filter, so a week of docs-only pushes cannot leave the gate
#      unverified; its cron is the `(schedule)` block below (the sandbox image rebuild runs at 03:00 the same day);
#   4. keep the security-gate job unconditional (no path filter, no `if:`) — see invariant 2.
# G1 (D21): `docs/**` is in the list because the gate-size guard reads the number of suites out of
# `security-gate/security-gate-report.md`, so a documentation edit can make a gate suite red. The list also
# names the security-critical surfaces (sandbox provider/runner, tool registry and runtime, policy engine, shell
# classifier, the agent runner) explicitly beside the `apps/**` glob, so narrowing that glob later cannot silently
# drop them.
# --- BEGIN RE-ENABLE RECIPE (triggers) ---
#   push:
#   pull_request:
#   schedule:
# --- END RE-ENABLE RECIPE (triggers) ---
# --- BEGIN RE-ENABLE RECIPE (paths) ---
#   - "apps/**"
#   - "packages/**"
#   - "tests/**"
#   - "scripts/**"
#   - "docker/**"
#   - "services/**"
#   - "docker-compose*.yml"
#   - "package.json"
#   - "package-lock.json"
#   - "tsconfig*.json"
#   - "vitest*.ts"
#   - ".env.example"
#   - ".env.production.example"
#   - ".github/workflows/**"
#   - "apps/agent-api/src/sandbox-*.ts"
#   - "apps/agent-api/src/sandbox-*.mjs"
#   - "apps/agent-api/src/runner-readiness.ts"
#   - "apps/agent-api/src/code-tool-runtime.ts"
#   - "apps/agent-api/src/code-tool-registry.ts"
#   - "apps/agent-api/src/code-tool-executors.ts"
#   - "apps/agent-api/src/code-policy-engine.ts"
#   - "apps/agent-api/src/code-shell-classifier.ts"
#   - "apps/agent-api/src/coding-agent-runner.ts"
#   - "apps/agent-api/src/approvals-repository.ts"
#   - "docs/**"
# --- END RE-ENABLE RECIPE (paths) ---
# --- BEGIN RE-ENABLE RECIPE (schedule) ---
#   - cron: "0 4 * * 1"
# --- END RE-ENABLE RECIPE (schedule) ---

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    # C4a/SG-1: mandatory. Security-gate suites must never fail, be skipped or be weakened, so this job
    # has no `continue-on-error` and no path filter — a failure blocks the workflow. Since G1 the workflow runs
    # on manual dispatch only, so "blocks the workflow" is true of a dispatched run and is **not** a merge or
    # release gate today; see the header and `security-gate/security-gate-report.md` §6 item 11.
    name: Security gate (SG-1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run security-gate
      # G1 (D20): before this step the gate's only report was a JSON file written into `mkdtempSync(...)` and
      # deleted in the script's `finally`, so a red or green gate left **no** evidence behind. The script now
      # also writes `artifacts/security-gate-report.json` (suite counts, catalogue counts, passed/failed/skipped
      # and the verdict), and this step makes it mandatory: `if-no-files-found: error` means a run that produced
      # no evidence fails, exactly like the eval job's report. No `if:` is used, because this job's own pinned
      # invariant forbids conditional steps.
      - name: Keep the gate verdict as evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: artifacts/security-gate-report.json
          if-no-files-found: error

  # G1 (item 2 / D1): the **database-backed** half of the gate. "The audit journal is append-only at the database
  # level" cannot be proven without PostgreSQL, and the hermetic `security-gate` job must stay runnable on a machine
  # that has none — so the database suites are a second, mandatory job with their own lists
  # (`SECURITY_GATE_DB_TESTS`, `UPGRADE_GATE_DB_TESTS`) and their own scripts, rather than entries added to the
  # hermetic list (which fails a run that reports a skipped test, and would therefore go red everywhere without a
  # database). This job has no `if:` and no `continue-on-error`, and `release-gate` `needs` it, so a red database
  # gate blocks the release exactly as the hermetic one does.
  security-gate-db:
    name: Security gate DB (SG-1 / D1)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The same image docker-compose.yml uses for the application database: migration 014 runs
        # `CREATE EXTENSION IF NOT EXISTS vector`, so a plain `postgres` image cannot apply the chain at all
        # (which is exactly how an earlier escalated run "found" a break at migration 014 that did not exist).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: npati
          POSTGRES_PASSWORD: npati
          POSTGRES_DB: npati_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npati -d npati_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # Set for **every** step of this job: neither database script skips when it is missing, it fails with that
    # reason, so a run that cannot see a database is red instead of being silently reduced to zero executed tests.
    env:
      DATABASE_URL: postgres://npati:npati@127.0.0.1:5432/npati_agent
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      # D1: the append-only journal measured under the **application role**, not under the superuser this
      # connection string names — UPDATE/DELETE refused while that role holds the privilege, a rogue INSERT that
      # would fork the chain refused, `verifyChain` detecting an out-of-band edit, and the trigger proven
      # load-bearing by removing it.
      - run: npm run security-gate:db
      # The migration chain on a real, clean database: exactly the registered set is applied, a second run changes
      # `schema_migrations` by nothing, and an older database is brought forward.
      - run: npm run gate:upgrade:db
      - name: Keep the database gate verdicts as evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-db-report
          path: |
            artifacts/security-gate-db-report.json
            artifacts/upgrade-gate-db-report.json
          if-no-files-found: error

  platform:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # C14: `npm run typecheck` only walks each workspace's own tsconfig, which does not include `tests/**`.
      # The test-suite type gate existed but was never run by CI, so a test file could drift out of type
      # correctness unnoticed; it is a step of this job now.
      - name: Typecheck the test suites
        run: npm run typecheck:tests
      # C14: the lint step. There was no `lint` script and no linter configuration in the repository at all,
      # so rule 10 ("typecheck, lint, tests, build") had nothing behind its third word. The script is the
      # dependency-free source-invariant guard (`scripts/lint-guard.mjs`, self-testing) plus the existing
      # web XSS source scan. A full ESLint/Prettier/Biome setup needs a dependency decision by the owner —
      # see the C14 report — and is deliberately not smuggled in here.
      - name: Lint (source-invariant guards)
        run: npm run lint
      - run: npm run audit:capabilities
      - run: npm run audit:sandbox-images
      # C14 (owner decision 1): the **one** test step, and it is not a plain `npm test`.
      #
      # The suite is still run in full — `scripts/check-known-failures.mjs` invokes exactly `vitest run` with no
      # file filter and no `--exclude` — but the verdict is a comparison against `known-failures.json`: GREEN
      # only while every actual failure is a documented, unexpired entry. A new failure is RED, a quarantined
      # test that went green is RED (the entry must be deleted), and an entry past its `expires_at` is RED, so
      # the 15 pre-existing failures are *tracked* instead of either blocking every change forever or being
      # hidden behind `--exclude`/`continue-on-error` (neither of which appears anywhere in this file).
      - name: Full test suite vs known-failures quarantine
        run: npm run test:known-failures
      - name: Keep the quarantine verdict as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: known-failures-report
          path: artifacts/known-failures-report.json
          if-no-files-found: warn
      # G1 (D5): the web suite (9 files / 76 tests: the web-source XSS invariant and the Code Workspace
      # isolation) ran in **no** workflow at all. It is a separate step with a separate config on purpose:
      # `vitest.config.ts` deliberately excludes `apps/web`, so folding these files into `npm test` would
      # change the known-failures baseline (10 files / 15 tests) — the step is additive evidence, not a second
      # verdict on the same run.
      - name: Web suite (XSS source scan and Code Workspace isolation)
        run: npm run test:web
      - run: npm run build

  # C14: the coding-agent eval smoke, as its own job so it is visible on its own and runs once (the platform
  # job repeats it on three operating systems for no extra evidence). It is hermetic by construction — the
  # C6/C9 harness drives scripted transcripts through the real tool runtime with no network, no Docker and no
  # live model (`NPATI_CODE_EVAL_LIVE` unset ⇒ recorded mode) — and it is the **existing** corpus suite, not a
  # second runner: `tests/coding-agent-c6-eval.test.ts` is where the corpus's wiring lives.
  evals:
    name: Coding-agent eval smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Prepare the report directory
        run: mkdir -p artifacts
      - name: Run the eval corpus (JSON report, non-zero exit on any failed task)
        run: npm run eval:smoke
      # `if-no-files-found: error` is the point: the report is evidence, so a run that produced none fails.
      - uses: actions/upload-artifact@v4
        with:
          name: coding-agent-eval-smoke-report
          path: artifacts/coding-agent-eval-smoke-report.json
          if-no-files-found: error

  docker:
    name: Docker / Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --file apps/agent-api/Dockerfile --tag npati-agent-api:ci .
      - run: docker build --file apps/agent-api/Dockerfile.project-sandbox --tag npati/project-sandbox:ci apps/agent-api
      - run: docker build --file apps/agent-api/Dockerfile.sandbox-egress --tag npati/sandbox-egress:ci apps/agent-api
      - run: docker build --file apps/web/Dockerfile --tag npati-agent-web:ci .

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    # C14: the eval job blocks the release as well. A gate that runs but blocks nothing is decoration.
    # G1 (D6): so does `security-gate`. It was missing from this list, which meant a release could go out
    # green while the mandatory security gate was red — the one job whose failure the project treats as
    # non-negotiable blocked nothing.
    # G1 (item 2 / D1): and so does `security-gate-db` — the database-level audit guarantees are the reason this
    # step exists, so they block the release beside the hermetic half rather than living in a job nobody needs.
    needs: [platform, docker, evals, security-gate, security-gate-db]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run gate:upgrade
