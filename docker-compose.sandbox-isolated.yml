services:
  agent-api:
    environment:
      NPATI_PROJECT_RUNTIME_MODE: isolated
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_URL: http://sandbox-runner:7865
      NPATI_PREVIEW_SECRET: ${NPATI_PREVIEW_SECRET:?required}
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-http://localhost:${NPATI_AGENT_API_PORT:-3001}}
  company-worker:
    environment:
      NPATI_PROJECT_RUNTIME_MODE: isolated
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_URL: http://sandbox-runner:7865
      NPATI_PREVIEW_SECRET: ${NPATI_PREVIEW_SECRET:?required}
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-http://localhost:${NPATI_AGENT_API_PORT:-3001}}
  sandbox-runner:
    container_name: npati-agent-sandbox-runner
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: sandbox-runner
    restart: unless-stopped
    environment:
      NPATI_PROJECT_RUNTIME_MODE: isolated
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_ISOLATED_HOST: "true"
      DOCKER_CONFIG: /tmp/npati-docker
      # These images are built locally for Docker Desktop testing.
      NPATI_ENVIRONMENT: development
      NPATI_SANDBOX_ALLOW_UNVERIFIED_IMAGES: "true"
      NPATI_SANDBOX_RUNNER_SECRET: ${NPATI_SANDBOX_RUNNER_SECRET:?required}
      NPATI_SANDBOX_ALLOWED_HOSTS: ${NPATI_SANDBOX_ALLOWED_HOSTS:-registry.npmjs.org,registry.yarnpkg.com,pypi.org,files.pythonhosted.org,repo.packagist.org,packagist.org,github.com,codeload.github.com,api.github.com,objects.githubusercontent.com,pub.dev,www.gstatic.com,fonts.gstatic.com}
      # The Project API host is appended to the allowlist automatically from this value.
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-}
      NPATI_SANDBOX_IMAGE: ${NPATI_SANDBOX_IMAGE:-npati/project-sandbox:local}
      NPATI_SANDBOX_EGRESS_IMAGE: npati/sandbox-egress:local
      NPATI_BROWSER_QA_IMAGE: npati/browser-qa:local
      NPATI_HOST_ADMISSION_MAX_CPU_PERCENT: ${NPATI_HOST_ADMISSION_MAX_CPU_PERCENT:-80}
      NPATI_HOST_ADMISSION_MIN_FREE_MEMORY_PERCENT: ${NPATI_HOST_ADMISSION_MIN_FREE_MEMORY_PERCENT:-15}
      NPATI_HOST_ADMISSION_SAMPLE_TTL_MS: ${NPATI_HOST_ADMISSION_SAMPLE_TTL_MS:-5000}
      NPATI_SANDBOX_SYNC_MAX_FILES: ${NPATI_SANDBOX_SYNC_MAX_FILES:-500}
      NPATI_SANDBOX_SYNC_MAX_BYTES: ${NPATI_SANDBOX_SYNC_MAX_BYTES:-20000000}
    ports:
      - "127.0.0.1:7865:7865"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    healthcheck:
      # A running HTTP process is insufficient: Preview also needs both local runtime images.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7865/health').then(r=>{if(!r.ok)process.exit(1);require('node:child_process').execFileSync('docker',['image','inspect',process.env.NPATI_SANDBOX_IMAGE,process.env.NPATI_SANDBOX_EGRESS_IMAGE],{timeout:4000,stdio:'ignore'})}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    networks: [npati-agent-network]
