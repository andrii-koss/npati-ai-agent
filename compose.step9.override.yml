# Step 9 local rebuild: build the API/worker image from the repository working tree
# (Steps 1-8 are uncommitted, so the build context is the repo root, not an artifacts snapshot).
services:
  agent-api:
    image: npati-fix-local:20261022
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
      args:
        NPATI_BUILD_COMMIT: fix-97b1d7a
  company-worker:
    image: npati-fix-local:20261022
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
      args:
        NPATI_BUILD_COMMIT: fix-97b1d7a
  sandbox-runner:
    image: npati-fix-runtime:20261022
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: project-runtime
      args:
        NPATI_BUILD_COMMIT: fix-97b1d7a