# Step 9 local rebuild: build the API/worker image from the repository working tree
# (Steps 1-8 are uncommitted, so the build context is the repo root, not an artifacts snapshot).
services:
  agent-api:
    image: npati-step9-local:20261021
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
      args:
        NPATI_BUILD_COMMIT: step9-b545d0c
  company-worker:
    image: npati-step9-local:20261021
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
      args:
        NPATI_BUILD_COMMIT: step9-b545d0c
