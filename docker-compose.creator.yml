# Optional source checkout for Global / Creator mode.
# Set NPATI_CREATOR_SOURCE_ROOT to an absolute path of a separate NPATI git checkout on the server.
# Combine with docker-compose.dokploy-isolated.yml. The path must be identical in API and runner.
services:
  agent-api:
    environment:
      NPATI_CREATOR_SOURCE_ROOT: ${NPATI_CREATOR_SOURCE_ROOT:?Set the absolute path of the NPATI source checkout}
      NPATI_CREATOR_OWNER_USER_IDS: ${NPATI_CREATOR_OWNER_USER_IDS:-}
    volumes:
      - type: bind
        source: ${NPATI_CREATOR_SOURCE_ROOT}
        target: ${NPATI_CREATOR_SOURCE_ROOT}
  company-worker:
    environment:
      NPATI_CREATOR_SOURCE_ROOT: ${NPATI_CREATOR_SOURCE_ROOT}
      NPATI_CREATOR_OWNER_USER_IDS: ${NPATI_CREATOR_OWNER_USER_IDS:-}
    volumes:
      - type: bind
        source: ${NPATI_CREATOR_SOURCE_ROOT}
        target: ${NPATI_CREATOR_SOURCE_ROOT}
  sandbox-runner:
    environment:
      NPATI_CREATOR_SOURCE_ROOT: ${NPATI_CREATOR_SOURCE_ROOT}
      NPATI_CREATOR_OWNER_USER_IDS: ${NPATI_CREATOR_OWNER_USER_IDS:-}
    volumes:
      - type: bind
        source: ${NPATI_CREATOR_SOURCE_ROOT}
        target: ${NPATI_CREATOR_SOURCE_ROOT}
