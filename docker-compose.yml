name: npati-agent

services:
  agent-api:
    container_name: npati-agent-api
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
    command: ["node", "dist/server.js"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &agent-api-env
      NPATI_PRODUCTION_URL: ${NPATI_PRODUCTION_URL:-http://production:8091}
      NPATI_PRODUCTION_TOKEN: ${NPATI_PRODUCTION_TOKEN:-}
      NODE_ENV: production
      NPATI_ENV: ${NPATI_ENV:-development}
      NPATI_AGENT_API_PORT: 3001
      NPATI_AUTH_STRICT: ${NPATI_AUTH_STRICT:-true}
      NPATI_BACKEND_URL: ${NPATI_BACKEND_URL:-https://www.npati.com}
      NPATI_JWT_SECRET: ${NPATI_JWT_SECRET:-}
      NPATI_ENCRYPTION_KEY: ${NPATI_ENCRYPTION_KEY:-npati-local-development-encryption-key-change-before-production}
      NPATI_REMOTE_ACCESS_TOKEN_SECRET: ${NPATI_REMOTE_ACCESS_TOKEN_SECRET:-npati-local-development-remote-token-key-change-before-production}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.npati.ai}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-npati-dashboard}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_SHARED_SECRET: ${OIDC_SHARED_SECRET:-}
      NPATI_COMPANY_RUN_TIMEOUT_MS: ${NPATI_COMPANY_RUN_TIMEOUT_MS:-120000}
      NPATI_ADMISSION_MAX_CONCURRENT: ${NPATI_ADMISSION_MAX_CONCURRENT:-20}
      NPATI_ADMISSION_MAX_CONCURRENT_PER_TENANT: ${NPATI_ADMISSION_MAX_CONCURRENT_PER_TENANT:-10}
      NPATI_ADMISSION_MAX_QUEUE_LENGTH: ${NPATI_ADMISSION_MAX_QUEUE_LENGTH:-200}
      NPATI_ADMISSION_FREE_SHED_THRESHOLD: ${NPATI_ADMISSION_FREE_SHED_THRESHOLD:-0.75}
      NPATI_COMPANY_WORKER_CONCURRENCY: ${NPATI_COMPANY_WORKER_CONCURRENCY:-2}
      NPATI_COMPANY_RUN_LEASE_MS: ${NPATI_COMPANY_RUN_LEASE_MS:-180000}
      NPATI_COMPANY_RECOVERY_INTERVAL_MS: ${NPATI_COMPANY_RECOVERY_INTERVAL_MS:-30000}
      NPATI_WEB_ORIGIN: ${NPATI_WEB_ORIGIN:-http://localhost:${NPATI_WEB_PORT:-3000}}
      NPATI_PREVIEW_ORIGIN: ${NPATI_PREVIEW_ORIGIN:-}
      NPATI_MESSAGING_WEBHOOK_BASE_URL: ${NPATI_MESSAGING_WEBHOOK_BASE_URL:-}
      OMNIROUTE_BASE_URL: http://omniroute:20128
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-npati-agent-internal-local}
      OMNIROUTE_MANAGEMENT_PASSWORD: ${OMNIROUTE_MANAGEMENT_PASSWORD:-}
      OMNIROUTE_TRANSCRIPTION_MODEL: ${OMNIROUTE_TRANSCRIPTION_MODEL:-openai/whisper-1}
      OMNIROUTE_TTS_MODEL: ${OMNIROUTE_TTS_MODEL:-openai/gpt-4o-mini-tts}
      OMNIROUTE_EMBEDDING_MODEL: ${OMNIROUTE_EMBEDDING_MODEL:-}
      OMNIROUTE_RERANK_MODEL: ${OMNIROUTE_RERANK_MODEL:-}
      OMNIROUTE_VISION_MODEL: ${OMNIROUTE_VISION_MODEL:-openai/gpt-5.6-luna}
      NPATI_DATA_DIR: /app/data
      NPATI_PROJECT_API_PUBLIC_URL: ${NPATI_PROJECT_API_PUBLIC_URL:-}
      NPATI_PROJECT_API_SANDBOX_URL: ${NPATI_PROJECT_API_SANDBOX_URL:-}
      NPATI_PROJECT_API_SERVICE_BINDING: ${NPATI_PROJECT_API_SERVICE_BINDING:-}
      NPATI_PROJECT_RUNTIME_MODE: ${NPATI_PROJECT_RUNTIME_MODE:-shared}
      NPATI_SANDBOX_RUNNER_MODE: ${NPATI_SANDBOX_RUNNER_MODE:-local}
      NPATI_SANDBOX_RUNNER_URL: ${NPATI_SANDBOX_RUNNER_URL:-http://sandbox-runner:7865}
      NPATI_SANDBOX_RUNNER_SECRET: ${NPATI_SANDBOX_RUNNER_SECRET:-npati-local-runner-token-change-before-production}
      NPATI_TERMINAL_TIMEOUT_MS: ${NPATI_TERMINAL_TIMEOUT_MS:-120000}
      NPATI_TERMINAL_BUILD_TIMEOUT_MS: ${NPATI_TERMINAL_BUILD_TIMEOUT_MS:-600000}
      NPATI_TERMINAL_OUTPUT_LIMIT_BYTES: ${NPATI_TERMINAL_OUTPUT_LIMIT_BYTES:-64000}
      NPATI_SANDBOX_IDLE_MS: ${NPATI_SANDBOX_IDLE_MS:-900000}
      NPATI_SANDBOX_SYNC_MAX_FILES: ${NPATI_SANDBOX_SYNC_MAX_FILES:-500}
      NPATI_SANDBOX_SYNC_MAX_BYTES: ${NPATI_SANDBOX_SYNC_MAX_BYTES:-20000000}
      NPATI_HUB_BASE_URL: ${NPATI_HUB_BASE_URL:-}
      NPATI_HUB_API_KEY: ${NPATI_HUB_API_KEY:-}
      CRAWL4AI_BASE_URL: http://crawler:11235
      NPATI_SEARXNG_URL: ${NPATI_SEARXNG_URL:-http://searxng:8080}
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-npati-local-internal-crawler-token}
      BROWSER_USE_WORKER_URL: http://browser-use-worker:8765
      NPATI_BROWSER_INTERNAL_TOKEN: ${NPATI_BROWSER_INTERNAL_TOKEN:-npati-local-browser-worker-token-change-before-production}
      NPATI_BROWSER_UPLOAD_ROOT: /app/data/browser-uploads
      WEB_RESEARCH_MAX_SEARCH_RESULTS: ${WEB_RESEARCH_MAX_SEARCH_RESULTS:-10}
      WEB_RESEARCH_MAX_COMPETITORS: ${WEB_RESEARCH_MAX_COMPETITORS:-5}
      WEB_RESEARCH_MAX_PAGES_PER_SITE: ${WEB_RESEARCH_MAX_PAGES_PER_SITE:-10}
      WEB_RESEARCH_MAX_CRAWL_DEPTH: ${WEB_RESEARCH_MAX_CRAWL_DEPTH:-2}
      WEB_RESEARCH_TIMEOUT_SECONDS: ${WEB_RESEARCH_TIMEOUT_SECONDS:-45}
      WEB_RESEARCH_MAX_CONCURRENT_JOBS: ${WEB_RESEARCH_MAX_CONCURRENT_JOBS:-2}
      WEB_RESEARCH_CACHE_TTL_SECONDS: ${WEB_RESEARCH_CACHE_TTL_SECONDS:-600}
      WEB_RESEARCH_MAX_CONTENT_CHARACTERS: ${WEB_RESEARCH_MAX_CONTENT_CHARACTERS:-80000}
      WEB_RESEARCH_PER_DOMAIN_DELAY_MS: ${WEB_RESEARCH_PER_DOMAIN_DELAY_MS:-750}
      DATABASE_URL: postgresql://${NPATI_POSTGRES_USER:-npati}:${NPATI_POSTGRES_PASSWORD:-npati}@postgres:5432/${NPATI_POSTGRES_DB:-npati_agent}
      NPATI_PROJECTS_POSTGRES_HOST: postgres-projects
      NPATI_PROJECTS_POSTGRES_PORT: 5432
      NPATI_PROJECTS_POSTGRES_ADMIN_USER: ${NPATI_PROJECTS_POSTGRES_ADMIN_USER:-npati_projects_admin}
      NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD: ${NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD:-npati-local-projects-db-change-before-production}
      NPATI_PROJECTS_POSTGRES_ADMIN_DB: postgres
      NPATI_PROJECTS_SNAPSHOT_DIR: /app/project-snapshots
      NPATI_PROJECTS_SNAPSHOT_RETENTION_DAYS: ${NPATI_PROJECTS_SNAPSHOT_RETENTION_DAYS:-30}
      NPATI_DATA_MAX_COLLECTIONS: ${NPATI_DATA_MAX_COLLECTIONS:-50}
      NPATI_DATA_MAX_FIELDS: ${NPATI_DATA_MAX_FIELDS:-100}
      NPATI_DATA_MAX_ROWS: ${NPATI_DATA_MAX_ROWS:-100}
      NPATI_DATA_MAX_DATABASE_BYTES: ${NPATI_DATA_MAX_DATABASE_BYTES:-1000000000}
      NPATI_DATA_MAX_CONNECTIONS: ${NPATI_DATA_MAX_CONNECTIONS:-10}
      NPATI_DATA_BACKUP_INTERVAL_MINUTES: ${NPATI_DATA_BACKUP_INTERVAL_MINUTES:-1440}
      NPATI_DATA_BACKUP_KEEP: ${NPATI_DATA_BACKUP_KEEP:-7}
      NPATI_DATA_BACKUP_TICK_SECONDS: ${NPATI_DATA_BACKUP_TICK_SECONDS:-300}
      NPATI_DATA_BACKUP_DISABLED: ${NPATI_DATA_BACKUP_DISABLED:-}
      NPATI_PROMOTE_DATA_MAX_ROWS: ${NPATI_PROMOTE_DATA_MAX_ROWS:-500}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_INT8_ENABLED: "true"
      FTS5_DB_PATH: /app/data/company-memory-fts5.sqlite
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-npati-local-admin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-npati-local-change-me}}
      MINIO_OPERATION_TIMEOUT_MS: ${MINIO_OPERATION_TIMEOUT_MS:-15000}
      MINIO_STREAM_IDLE_TIMEOUT_MS: ${MINIO_STREAM_IDLE_TIMEOUT_MS:-30000}
      MINIO_STREAM_TOTAL_TIMEOUT_MS: ${MINIO_STREAM_TOTAL_TIMEOUT_MS:-300000}
      NPATI_STORAGE_RECONCILE_INTERVAL_MS: ${NPATI_STORAGE_RECONCILE_INTERVAL_MS:-21600000}
      NPATI_STORAGE_ORPHAN_GRACE_MS: ${NPATI_STORAGE_ORPHAN_GRACE_MS:-86400000}
      NPATI_STORAGE_RECONCILE_LEASE_MS: ${NPATI_STORAGE_RECONCILE_LEASE_MS:-1800000}
      NPATI_STORAGE_RECONCILE_PAGE_SIZE: ${NPATI_STORAGE_RECONCILE_PAGE_SIZE:-250}
    ports:
      - "${NPATI_AGENT_API_PORT:-3001}:3001"
      - "${NPATI_WEB_PORT:-3000}:3001"
    volumes:
      - npati-agent-data:/app/data
      - postgres-projects-snapshots:/app/project-snapshots
    depends_on:
      omniroute:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-projects:
        condition: service_healthy
      minio:
        condition: service_healthy
      browser-use-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [npati-agent-network, npati-projects-db-network, npati-sandbox-control, npati-production-control]

  company-worker:
    container_name: npati-agent-company-worker
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: runtime
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      <<: *agent-api-env
      NPATI_PRODUCTION_URL: ""
      NPATI_PRODUCTION_TOKEN: ""
      NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD: ""
    volumes:
      - npati-agent-data:/app/data
    depends_on:
      omniroute:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      crawler:
        condition: service_healthy
      browser-use-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "import('redis').then(async({createClient})=>{const c=createClient({url:process.env.REDIS_URL});await c.connect();const v=await c.get('npati:company-worker:heartbeat');await c.quit();if(!v)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    networks: [npati-agent-network, npati-sandbox-control]

  sandbox-runner:
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
      target: project-runtime
      args:
        NPATI_BUILD_COMMIT: ${NPATI_BUILD_COMMIT:-unknown}
        NPATI_BUILD_TIME: ${NPATI_BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      NPATI_PROJECT_RUNTIME_MODE: shared
      # Optional dev Project API binding over the existing signed runner channel.
      NPATI_PROJECT_API_SANDBOX_URL: ${NPATI_PROJECT_API_SANDBOX_URL:-}
      NPATI_PROJECT_API_SERVICE_BINDING: ${NPATI_PROJECT_API_SERVICE_BINDING:-}
      NPATI_SANDBOX_RUNNER_MODE: local
      NPATI_SANDBOX_RUNNER_SECRET: ${NPATI_SANDBOX_RUNNER_SECRET:-npati-local-runner-token-change-before-production}
      ALLOWED_HOSTS: ${NPATI_SANDBOX_ALLOWED_HOSTS:-registry.npmjs.org,registry.yarnpkg.com,pypi.org,files.pythonhosted.org,github.com,codeload.github.com,api.github.com,objects.githubusercontent.com,repo.packagist.org,pub.dev,www.gstatic.com,fonts.gstatic.com,fonts.googleapis.com}
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - project-runtime-workspaces:/projects
      - project-runtime-state:/runtime-state
    expose:
      - "7865"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL, NET_ADMIN]
    # Permit unprivileged namespace setup, without SYS_ADMIN or privileged mode.
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/sandbox/project-runtime-seccomp.json
      - apparmor=unconfined
      # Linux 5.15 rejects nested procfs mounts when Docker masks /proc paths.
      # Project commands get a separate read-only procfs from Bubblewrap.
      - systempaths=unconfined
    cpus: ${NPATI_PROJECT_RUNTIME_CPU:-4}
    mem_limit: ${NPATI_PROJECT_RUNTIME_MEMORY:-4g}
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7865/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [npati-sandbox-control, npati-sandbox-egress]

  crawler:
    container_name: npati-agent-crawler
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
      args:
        CRAWL4AI_VERSION: ${CRAWL4AI_VERSION:-0.9.2}
    image: npati-agent-crawler:${CRAWL4AI_VERSION:-0.9.2}
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-npati-local-internal-crawler-token}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:-npati-local-internal-crawler-secret}
      REDIS_PASSWORD: ${CRAWL4AI_SECRET_KEY:-npati-local-internal-crawler-secret}
      NPATI_CRAWLER_STATE_DIR: /app/npati-state
      NPATI_CRAWLER_PAGE_TIMEOUT_MS: ${NPATI_CRAWLER_PAGE_TIMEOUT_MS:-45000}
    volumes:
      - crawler-state:/app/npati-state
    expose:
      - "11235"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks: [npati-agent-network]

  searxng:
    image: searxng/searxng:${SEARXNG_VERSION:-2026.10.30-ffa88e3ba}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${NPATI_SEARXNG_SECRET:-npati-local-searxng-secret-change-before-production}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [npati-agent-network]

  browser-use-worker:
    container_name: npati-agent-browser-use-worker
    build:
      context: .
      dockerfile: services/browser-use-worker/Dockerfile
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      NPATI_ENV: ${NPATI_ENV:-development}
      NPATI_BROWSER_INTERNAL_TOKEN: ${NPATI_BROWSER_INTERNAL_TOKEN:-npati-local-browser-worker-token-change-before-production}
      NPATI_BROWSER_STATE_DIR: /state
      NPATI_BROWSER_MAX_RETRIES: ${NPATI_BROWSER_MAX_RETRIES:-2}
      BROWSER_USE_API_KEY: ${BROWSER_USE_API_KEY:-}
      BROWSER_USE_MODEL: ${BROWSER_USE_MODEL:-bu-2-0}
    volumes:
      - browser-use-state:/state
      - npati-agent-data:/app/data:ro
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 45s
    networks: [npati-agent-network]

  omniroute:
    container_name: npati-agent-omniroute
    image: docker.io/diegosouzapw/omniroute:3.8.52@sha256:b08a12e876baa8a5ccadd1ebbe346fe7267dba3b1c9f4fd6bb02070fae41ab6c
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: 20128
      DASHBOARD_PORT: 20128
      API_PORT: 20129
      API_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-npati-agent-internal-local}
      OMNIROUTE_API_KEY_ID: env-key
      # Every /v1 caller must present OMNIROUTE_API_KEY (the 3.8.52 image default, stated so a rollback keeps it).
      REQUIRE_API_KEY: "true"
      # Never resume a cut stream after a tool call was emitted, should mid-stream continuation ever be enabled.
      STREAM_RECOVERY_TOOLCALL_ORDER_FIX: "true"
      JINA_AI_API_KEY: ${JINA_AI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    expose:
      - "20128"
      - "20129"
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [npati-agent-network]

  qdrant:
    profiles: [qdrant]
    container_name: npati-agent-qdrant
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${NPATI_QDRANT_PORT:-6333}:6333"
    expose:
      - "6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [npati-agent-network]
  minio:
    container_name: npati-agent-minio
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-npati-local-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-npati-local-change-me}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [npati-agent-network]

  redis:
    container_name: npati-agent-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:${NPATI_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [npati-agent-network]

  postgres-projects:
    container_name: npati-agent-postgres-projects
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NPATI_PROJECTS_POSTGRES_ADMIN_USER:-npati_projects_admin}
      POSTGRES_PASSWORD: ${NPATI_PROJECTS_POSTGRES_ADMIN_PASSWORD:-npati-local-projects-db-change-before-production}
      POSTGRES_DB: postgres
    volumes:
      - postgres-projects-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NPATI_PROJECTS_POSTGRES_ADMIN_USER:-npati_projects_admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 256
    networks: [npati-projects-db-network]
  postgres:
    container_name: npati-agent-postgres
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NPATI_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${NPATI_POSTGRES_USER:-npati}
      POSTGRES_PASSWORD: ${NPATI_POSTGRES_PASSWORD:-npati}
      POSTGRES_DB: ${NPATI_POSTGRES_DB:-npati_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NPATI_POSTGRES_USER:-npati} -d ${NPATI_POSTGRES_DB:-npati_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [npati-agent-network]

  traefik:
    profiles: [production]
    image: traefik:v3.6
    restart: unless-stopped
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    entrypoint: [/bin/sh, /etc/npati/traefik.sh]
    environment:
      NPATI_PRODUCTION_ACME_EMAIL: ${NPATI_PRODUCTION_ACME_EMAIL:-}
    ports:
      - "${NPATI_PRODUCTION_BIND:-0.0.0.0}:${NPATI_PRODUCTION_HTTP_PORT:-80}:8080"
      - "${NPATI_PRODUCTION_BIND:-0.0.0.0}:${NPATI_PRODUCTION_HTTPS_PORT:-443}:8443"
    volumes:
      - ./apps/production-runtime/traefik.sh:/etc/npati/traefik.sh:ro
      - npati-production-routes:/routes:ro
      - npati-production-certs:/certs
    networks: [npati-production-edge]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    depends_on:
      production:
        condition: service_healthy

  production:
    profiles: [production]
    build: ./apps/production-runtime
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      NPATI_PRODUCTION_TOKEN: ${NPATI_PRODUCTION_TOKEN:-}
      NPATI_PRODUCTION_ACME_EMAIL: ${NPATI_PRODUCTION_ACME_EMAIL:-}
      NPATI_PRODUCTION_DOMAIN: ${NPATI_PRODUCTION_DOMAIN:-}
      NPATI_PRODUCTION_LOCAL: ${NPATI_PRODUCTION_LOCAL:-false}
      NPATI_PRODUCTION_HTTP_PORT: ${NPATI_PRODUCTION_HTTP_PORT:-80}
      NPATI_PRODUCTION_HTTPS_PORT: ${NPATI_PRODUCTION_HTTPS_PORT:-443}
    volumes:
      - npati-production-state:/srv/production
      - npati-production-routes:/routes
      - npati-production-certs:/certs
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /builds:mode=0711,size=640m
    cpus: ${NPATI_PRODUCTION_CPUS:-4}
    mem_limit: ${NPATI_PRODUCTION_MEMORY:-4g}
    memswap_limit: ${NPATI_PRODUCTION_MEMORY:-4g}
    pids_limit: 512
    networks: [npati-production-edge, npati-production-control]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  npati-sandbox-control:
    internal: true
  npati-sandbox-egress:
  npati-production-edge:
  npati-production-control:
    internal: true
  npati-projects-db-network:
    internal: true
  npati-agent-network:
    name: npati-agent-network

volumes:
  project-runtime-workspaces:
  project-runtime-state:
  npati-production-state:
  npati-production-routes:
  npati-production-certs:
  npati-agent-data:
    name: npati-agent-data
  omniroute-data:
    name: npati-agent-omniroute-data
  redis-data:
    name: npati-agent-redis-data
  postgres-data:
    name: npati-agent-postgres-data
  postgres-projects-data:
    name: npati-agent-postgres-projects-data
  postgres-projects-snapshots:
    name: npati-agent-postgres-projects-snapshots
  crawler-state:
    name: npati-agent-crawler-state
  minio-data:
    name: npati-agent-minio-data
  qdrant-data:
    name: npati-agent-qdrant-data
  browser-use-state:
    name: npati-agent-browser-use-state
