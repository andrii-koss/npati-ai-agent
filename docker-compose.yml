name: npati-agent

services:
  web:
    container_name: npati-agent-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${NPATI_WEB_PORT:-3000}:3000"
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [npati-agent-network]

  agent-api:
    container_name: npati-agent-api
    build:
      context: .
      dockerfile: apps/agent-api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NPATI_ENV: ${NPATI_ENV:-development}
      NPATI_AGENT_API_PORT: 3001
      NPATI_WEB_ORIGIN: http://localhost:${NPATI_WEB_PORT:-3000}
      OMNIROUTE_BASE_URL: http://omniroute:20128
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-npati-agent-internal-local}
      OMNIROUTE_MANAGEMENT_PASSWORD: ${OMNIROUTE_MANAGEMENT_PASSWORD:-}
      OMNIROUTE_TRANSCRIPTION_MODEL: ${OMNIROUTE_TRANSCRIPTION_MODEL:-openai/whisper-1}
      NPATI_DATA_DIR: /app/data
      NPATI_HUB_BASE_URL: ${NPATI_HUB_BASE_URL:-}
      NPATI_HUB_API_KEY: ${NPATI_HUB_API_KEY:-}
      CRAWL4AI_BASE_URL: http://crawler:11235
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-npati-local-internal-crawler-token}
      WEB_RESEARCH_MAX_SEARCH_RESULTS: ${WEB_RESEARCH_MAX_SEARCH_RESULTS:-10}
      WEB_RESEARCH_MAX_COMPETITORS: ${WEB_RESEARCH_MAX_COMPETITORS:-5}
      WEB_RESEARCH_MAX_PAGES_PER_SITE: ${WEB_RESEARCH_MAX_PAGES_PER_SITE:-10}
      WEB_RESEARCH_MAX_CRAWL_DEPTH: ${WEB_RESEARCH_MAX_CRAWL_DEPTH:-2}
      WEB_RESEARCH_TIMEOUT_SECONDS: ${WEB_RESEARCH_TIMEOUT_SECONDS:-45}
      WEB_RESEARCH_MAX_CONCURRENT_JOBS: ${WEB_RESEARCH_MAX_CONCURRENT_JOBS:-2}
      WEB_RESEARCH_CACHE_TTL_SECONDS: ${WEB_RESEARCH_CACHE_TTL_SECONDS:-600}
      WEB_RESEARCH_MAX_CONTENT_CHARACTERS: ${WEB_RESEARCH_MAX_CONTENT_CHARACTERS:-80000}
      WEB_RESEARCH_PER_DOMAIN_DELAY_MS: ${WEB_RESEARCH_PER_DOMAIN_DELAY_MS:-750}
      DATABASE_URL: postgresql://${NPATI_POSTGRES_USER:-npati}:${NPATI_POSTGRES_PASSWORD:-npati}@postgres:5432/${NPATI_POSTGRES_DB:-npati_agent}
      REDIS_URL: redis://redis:6379
    ports:
      - "${NPATI_AGENT_API_PORT:-3001}:3001"
    volumes:
      - npati-agent-data:/app/data
    depends_on:
      omniroute:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [npati-agent-network]

  crawler:
    container_name: npati-agent-crawler
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
      args:
        CRAWL4AI_VERSION: ${CRAWL4AI_VERSION:-0.9.2}
    image: npati-agent-crawler:${CRAWL4AI_VERSION:-0.9.2}
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-npati-local-internal-crawler-token}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:-npati-local-internal-crawler-secret}
      NPATI_CRAWLER_STATE_DIR: /app/npati-state
      NPATI_CRAWLER_PAGE_TIMEOUT_MS: ${NPATI_CRAWLER_PAGE_TIMEOUT_MS:-45000}
    volumes:
      - crawler-state:/app/npati-state
    expose:
      - "11235"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11235/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks: [npati-agent-network]

  omniroute:
    container_name: npati-agent-omniroute
    image: docker.io/diegosouzapw/omniroute:3.8.50
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: 20128
      DASHBOARD_PORT: 20128
      API_PORT: 20129
      API_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-npati-agent-internal-local}
      OMNIROUTE_API_KEY_ID: env-key
    expose:
      - "20128"
      - "20129"
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [npati-agent-network]

  redis:
    container_name: npati-agent-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [npati-agent-network]

  postgres:
    container_name: npati-agent-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NPATI_POSTGRES_USER:-npati}
      POSTGRES_PASSWORD: ${NPATI_POSTGRES_PASSWORD:-npati}
      POSTGRES_DB: ${NPATI_POSTGRES_DB:-npati_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NPATI_POSTGRES_USER:-npati} -d ${NPATI_POSTGRES_DB:-npati_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [npati-agent-network]

networks:
  npati-agent-network:
    name: npati-agent-network

volumes:
  npati-agent-data:
    name: npati-agent-data
  omniroute-data:
    name: npati-agent-omniroute-data
  redis-data:
    name: npati-agent-redis-data
  postgres-data:
    name: npati-agent-postgres-data
  crawler-state:
    name: npati-agent-crawler-state
